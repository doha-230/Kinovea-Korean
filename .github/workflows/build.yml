name: Build Kinovea

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  VERSION: 2026.1.0

# Needed so the tag-triggered job can create a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Resolve version
      id: ver
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/*') {
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
        } else {
          $v = $env:VERSION
        }
        "version=$v" >> $env:GITHUB_OUTPUT
        Write-Host "Resolved version: $v"

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Kinovea.VS2019.sln

    - name: Cache extra dependencies
      id: extra-deps-cache
      uses: actions/cache@v4
      with:
        path: Refs/FFmpeg
        key: ${{ runner.os }}-extra-deps-${{ hashFiles('Refs/get-dependencies.ps1') }}

    - name: Get extra dependencies
      if: steps.extra-deps-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./Refs/get-dependencies.ps1

    - name: Check source encoding (UTF-8 BOM)
      run: python Tools/lint/check_encoding.py

    - name: Check csproj includes
      run: python Tools/lint/check_csproj_includes.py --baseline Tools/lint/baseline-csproj.txt

    - name: Check culture-sensitive number parsing
      run: python Tools/lint/check_culture_parsing.py

    - name: Check hard-coded UI strings
      run: python Tools/i18n/scan_hardcoded_strings.py --baseline Tools/i18n/baseline-hardcoded.txt

    - name: Check Korean translations
      run: python Tools/i18n/check_translations.py --lang ko

    - name: Build Solution
      run: msbuild Kinovea.VS2019.sln /p:Platform="x64" /p:Configuration=Release /p:AllowedReferenceRelatedFileExtensions=none

    - name: Build test project
      run: msbuild Kinovea.Tests\Kinovea.Tests.csproj /p:Platform=x64 /p:Configuration=Release

    - name: Run smoke tests
      run: .\Kinovea.Tests\bin\x64\Release\Kinovea.Tests.exe

    - name: Prepare Portable build
      shell: pwsh
      run: |
        $appData = "Kinovea/bin/x64/Release/AppData"
        New-Item -ItemType Directory -Force -Path $appData | Out-Null
        New-Item -ItemType File -Force -Path "$appData/portable" | Out-Null

    - name: Create Portable Archive
      shell: pwsh
      run: |
        Compress-Archive `
          -Path "Kinovea/bin/x64/Release/*" `
          -DestinationPath "Kinovea-Portable-${{ steps.ver.outputs.version }}.zip"

    - name: Upload Portable
      uses: actions/upload-artifact@v6
      with:
        name: Kinovea-Portable-${{ steps.ver.outputs.version }}
        path: Kinovea-Portable-${{ steps.ver.outputs.version }}.zip

    - name: Remove Portable AppData Folder
      shell: pwsh
      run: Remove-Item -Recurse -Force "Kinovea/bin/x64/Release/AppData"

    - name: Install NSIS
      uses: repolevedavaj/install-nsis@v1.2.0
      with:
        nsis-version: '3.11'

    - name: Make Installer
      shell: cmd
      run: makensis /DVERSION=${{ steps.ver.outputs.version }} Installer\Kinovea.nsi

    - name: Upload Installer
      id: upload-installer
      uses: actions/upload-artifact@v6
      with:
        name: Kinovea-Installer-${{ steps.ver.outputs.version }}
        path: Installer/Kinovea-${{ steps.ver.outputs.version }}.exe

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Kinovea ${{ steps.ver.outputs.version }}
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          Kinovea-Portable-${{ steps.ver.outputs.version }}.zip
          Installer/Kinovea-${{ steps.ver.outputs.version }}.exe
